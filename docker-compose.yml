version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"   # AMQP protocol port
      - "15672:15672" # Management UI port
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  data-collector-service:
    build:
      context: ../data-collector-service
      dockerfile: Dockerfile
    container_name: data-collector-service
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - DATA_QUEUE_NAME=marketplace_data
      - DATASET_PATH=/app/dataset/ozon.csv
      - SCHEDULER_INTERVAL_HOURS=24
    volumes:
      - ../data-collector-service/dataset:/app/dataset
    networks:
      - app-network
    restart: unless-stopped

  data-processor-service:
    build:
      context: ../data-processor-service
      dockerfile: Dockerfile
    container_name: data-processor-service
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - DATA_QUEUE_NAME=marketplace_data
      - DATA_PATH=/app/data
      - SCRIPTS_PATH=/app/scripts
      - PYTHON_PATH=python
      - CUTOFF_DATE=2025-03-20
      - BATCH_SIZE=1000
      - CONSUME_TIMEOUT_SECONDS=60
      - SCHEDULER_INTERVAL_HOURS=24
    volumes:
      - ../data-processor-service/data:/app/data
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  rabbitmq_data:
    driver: local
