version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"   # AMQP protocol port
      - "15672:15672" # Management UI port
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=marketplace_data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  data-collector-service:
    build:
      context: ../data-collector-service
      dockerfile: Dockerfile
    container_name: data-collector-service
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - DATA_QUEUE_NAME=marketplace_data
      - DATASET_PATH=/app/dataset/ozon.csv
      - SCHEDULER_INTERVAL_HOURS=24
    volumes:
      - ../data-collector-service/dataset:/app/dataset
    networks:
      - app-network
    restart: unless-stopped

  data-processor-service:
    build:
      context: ../data-processor-service
      dockerfile: Dockerfile
    container_name: data-processor-service
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - DATA_QUEUE_NAME=marketplace_data
      - DATA_PATH=/app/data
      - SCRIPTS_PATH=/app/scripts
      - PYTHON_PATH=python
      - CUTOFF_DATE=2025-03-20
      - BATCH_SIZE=5000
      - CONSUME_TIMEOUT_SECONDS=60
      - SCHEDULER_INTERVAL_HOURS=24
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB_NAME=marketplace_data
      - POSTGRES_SSL_MODE=disable
    volumes:
      - ./processor_data:/app/data
    networks:
      - app-network
    restart: unless-stopped

  ml-service:
    build:
      context: ../ML-service
      dockerfile: Dockerfile
    container_name: ml-service
    depends_on:
      - data-processor-service
      - postgres
    environment:
      - SERVER_PORT=8080
      - MODEL_PATH=/app/models
      - PROCESSED_DATA_PATH=/app/processor_data/processed
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=marketplace_data
      - POSTGRES_SSLMODE=disable
    volumes:
      - ./processor_data:/app/processor_data
      - ./models:/app/models
    ports:
      - "6785:8080"
    networks:
      - app-network
    restart: unless-stopped

  ui-service:
    build:
      context: ../ui-service
      dockerfile: Dockerfile
    container_name: ui-service
    ports:
      - "80:80"
    depends_on:
      - ml-service
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  rabbitmq_data:
    driver: local
  postgres_data:
    driver: local
